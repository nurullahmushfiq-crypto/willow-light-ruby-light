<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "Sora";
      font-style: normal;
      font-weight: 600;
      src: url("./sora-600.ttf") format("truetype");
    }
    @font-face {
      font-family: "Sora";
      font-style: normal;
      font-weight: 700;
      src: url("./sora-700.ttf") format("truetype");
    }
    @font-face {
      font-family: "Sora";
      font-style: normal;
      font-weight: 800;
      src: url("./sora-800.ttf") format("truetype");
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #0C0D10;
    }
    .stage {
      position: relative;
      width: 1200px;
      height: 630px;
    }
    .stage svg {
      position: absolute;
      inset: 0;
      display: block;
    }
    .lockup {
      position: absolute;
      left: 50%;
      top: 44%;
      transform: translate(-50%, -50%);
      width: 72%;
      text-align: center;
      z-index: 2;
      pointer-events: none;
    }
    .lockup h1 {
      margin: 0;
      font-family: "Sora", sans-serif;
      font-weight: 800;
      font-size: 128px;
      letter-spacing: 0.16em;
      line-height: 0.92;
      color: #F3F1EC;
      text-indent: 0.16em;
      text-shadow:
        0 2px 0 rgba(12, 13, 16, 0.35),
        0 8px 28px rgba(12, 13, 16, 0.55),
        0 0 64px rgba(196, 92, 74, 0.18);
    }
    .lockup .rule {
      width: 56px;
      height: 4px;
      margin: 22px auto 18px;
      background: #C45C4A;
      border-radius: 2px;
    }
    .lockup p {
      margin: 0;
      font-family: "Sora", sans-serif;
      font-weight: 600;
      font-size: 18px;
      letter-spacing: 0.42em;
      text-indent: 0.42em;
      color: #C5CDD6;
      text-transform: uppercase;
      text-shadow: 0 2px 12px rgba(12, 13, 16, 0.7);
    }
  </style>
</head>
<body>
  <div class="stage">
    <svg viewBox="0 0 1200 630" width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0C0D10"/>
          <stop offset="42%" stop-color="#10131a"/>
          <stop offset="68%" stop-color="#1A1D24"/>
          <stop offset="100%" stop-color="#0C0D10"/>
        </linearGradient>
        <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#C45C4A" stop-opacity="0"/>
          <stop offset="55%" stop-color="#C45C4A" stop-opacity="0.28"/>
          <stop offset="100%" stop-color="#C45C4A" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#C5CDD6" stop-opacity="0.55"/>
          <stop offset="42%" stop-color="#C5CDD6" stop-opacity="0.12"/>
          <stop offset="100%" stop-color="#C5CDD6" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="sunken" cx="50%" cy="80%" r="70%">
          <stop offset="0%" stop-color="#C45C4A" stop-opacity="0.22"/>
          <stop offset="55%" stop-color="#0C0D10" stop-opacity="0"/>
          <stop offset="100%" stop-color="#0C0D10" stop-opacity="0.55"/>
        </radialGradient>
        <linearGradient id="roofFace" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#232833"/>
          <stop offset="100%" stop-color="#14161c"/>
        </linearGradient>
        <linearGradient id="roofFaceR" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#262b36"/>
          <stop offset="100%" stop-color="#12141a"/>
        </linearGradient>
        <linearGradient id="farCity" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#151820"/>
          <stop offset="100%" stop-color="#0C0D10"/>
        </linearGradient>
      </defs>

      <rect width="1200" height="630" fill="url(#sky)"/>

      <circle cx="1008" cy="118" r="46" fill="#C5CDD6"/>
      <circle cx="1022" cy="108" r="14" fill="#F3F1EC" opacity="0.18"/>

      <!-- stars -->

      <!-- far skyline -->
      <g fill="url(#farCity)">
        <rect x="40" y="318" width="70" height="160"/>

        <rect x="244" y="278" width="44" height="200"/>

        <rect x="1054" y="284" width="60" height="194"/>

      <!-- far peaked roofs -->
      <g fill="#12151c">
        <polygon points="244,278 266,252 288,278"/>

      <rect x="176" y="412" width="18" height="36" fill="#14161c"/>

      <g transform="translate(250, 412)">
        <rect x="10" y="16" width="4" height="20" fill="#14161c"/>

      <g>

      <!-- FOREGROUND RIGHT ROOF -->
      <rect x="732" y="438" width="468" height="192" fill="url(#roofFaceR)"/>

        <rect x="1168" y="420" width="22" height="12"/>
      </g>
      <!-- stair bulkhead -->
      <rect x="1088" y="392" width="72" height="40" fill="#14161c"/>
      <polygon points="1088,392 1124,368 1160,392" fill="#1A1D24"/>
      <rect x="1116" y="400" width="16" height="22" fill="#F3F1EC" opacity="0.55"/>
      <!-- antenna -->
      <rect x="860" y="352" width="3" height="78" fill="#C5CDD6" opacity="0.45"/>
      <rect x="852" y="360" width="19" height="3" fill="#C5CDD6" opacity="0.35"/>
      <!-- right windows -->
      <g>
        <rect x="768" y="462" width="14" height="20" fill="#F3F1EC" opacity="0.9"/>
        <rect x="796" y="462" width="14" height="20" fill="#0C0D10" opacity="0.4"/>
        <rect x="824" y="462" width="14" height="20" fill="#F3F1EC" opacity="0.7"/>

      <!-- gap mist -->
      <ellipse cx="600" cy="500" rx="160" ry="36" fill="#C5CDD6" opacity="0.06"/>

      <!-- SCARF (behind runner) -->

      <!-- RUNNER — leaping right, cream silhouette -->
      <g fill="#F3F1EC">

                 C618 470, 600 454, 586 444
                 C580 438, 584 428, 592 426Z"/>

      <rect width="1200" height="630" fill="url(#sunken)"/>

    <div class="lockup">
      <h1>STRIDE</h1>
      <div class="rule"></div>
      <p>Endless dusk rooftops</p>
    </div>
  </div>
</body>
</html>
